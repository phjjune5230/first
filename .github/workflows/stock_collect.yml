name: Stock Daily Collector

on:
  schedule:
    # KRX 마감 후 수집: 16:30 KST = 07:30 UTC
    - cron: '30 7 * * 1-5'
    # US 전날 데이터 수집: 09:10 KST = 00:10 UTC (화~토)
    - cron: '10 0 * * 2-6'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('collector/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run daily update
        working-directory: collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          export RUN_HOUR_UTC=$(date -u +%H)
          export RUN_MINUTE_UTC=$(date -u +%M)
          python daily_update.py
